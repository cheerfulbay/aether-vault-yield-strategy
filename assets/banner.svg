<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="50%" stop-color="#4361ee"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#2a3a5e" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>

  <circle cx="200" cy="190" r="140" fill="#4cc9f0" opacity="0.1" filter="blur(50px)"/>
  <circle cx="1000" cy="190" r="140" fill="#7209b7" opacity="0.1" filter="blur(50px)"/>

  <!-- Logo Icon -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="130" height="130" rx="28" fill="#131e3a" stroke="url(#brand)" stroke-width="3"/>
    <path d="M 65 30 L 100 95 L 30 95 Z" fill="none" stroke="url(#brand)" stroke-width="4"/>
    <circle cx="65" cy="73" r="12" fill="#4cc9f0"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="265" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Aether Yield Strategy Vault
  </text>
  <text x="265" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">
    ERC-4626 Tokenized Yield Strategy Vault &amp; Autonomous Liquidity Compounding
  </text>

  <!-- Badges -->
  <g transform="translate(265, 235)">
    <rect x="0" y="0" width="115" height="30" rx="15" fill="#1e293b" stroke="#4cc9f0" stroke-width="1.2"/>
    <text x="57" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#4cc9f0" text-anchor="middle">ERC-4626</text>

    <rect x="130" y="0" width="135" height="30" rx="15" fill="#1e293b" stroke="#4361ee" stroke-width="1.2"/>
    <text x="197" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#4361ee" text-anchor="middle">Solidity 0.8.24</text>

    <rect x="280" y="0" width="125" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
    <text x="342" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">EVM Universal</text>

    <rect x="420" y="0" width="115" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1.2"/>
    <text x="477" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">Apache-2.0</text>
  </g>
</svg>
